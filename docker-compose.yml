services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webkitsunova}
      POSTGRES_USER: ${POSTGRES_USER:-webkitsunova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webkitsunova_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webkitsunova} -d ${POSTGRES_DB:-webkitsunova}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Local development with hot reload. Runs `next dev` against the same
  # Postgres service; the `app` service above is the production image.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: build
    restart: unless-stopped
    command: sh -c "npx prisma generate && npx next dev"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next_cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dev_node_modules:
  dev_next_cache:
