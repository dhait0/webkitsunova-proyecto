services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webkitsunova}
      POSTGRES_USER: ${POSTGRES_USER:-webkitsunova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webkitsunova_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webkitsunova} -d ${POSTGRES_DB:-webkitsunova}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://webkitsunova:webkitsunova_dev@postgres:5432/webkitsunova?schema=public}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-change-me-now-123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
